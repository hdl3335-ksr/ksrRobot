title: KSR Blog
description: 사진과 기록을 모아두는 Jekyll 기반 블로그
theme: just-the-docs

# Update these after you create the GitHub repository.
# If your repo name is different, change baseurl to "/YOUR-REPO-NAME".
url: "https://hdl3335-ksr.github.io"
